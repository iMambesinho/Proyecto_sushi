<div class="container"> <!-- Contenedor main -->
  
  <div class="bg-image"></div> <!-- Imagen de background -->

  <div class="bg-side"> <!-- Contenedor del formulario de login -->
    <img src="../../../../assets/img/Logo.png" alt="Logo" class="logo" /> <!-- Ruta del logo -->
    <div class="card">
      <h4 class="title">Inicio</h4> <!-- Título del login -->
      <form>
        <label class="field" for="logemail"> <!-- Campo de email  -->
          <span class="input-icon">@</span> <!-- Icono de email -->
          <input 
            autocomplete="off" 
            id="logemail"
            placeholder="Email"
            class="input-field"
            type="email"
            [formControl]="email"
          />
        </label>

        <label class="field" for="logpass"> <!-- Campo de contraseña -->
          <svg class="input-icon" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg"> <!-- Icono de candado del login -->
            <path d="M80 192V144C80 64.47 144.5 0 224 0C303.5 0 368 64.47 368 144V192H384C419.3 192 448 220.7 448 256V448C448 483.3 419.3 512 384 512H64C28.65 512 0 483.3 0 448V256C0 220.7 28.65 192 64 192H80zM144 192H304V144C304 99.82 268.2 64 224 64C179.8 64 144 99.82 144 144V192z"></path>
          </svg>
          <input
            id="logpass"
            placeholder="Contraseña"
            class="input-field"
            type="password"
            [formControl]="password"
          />
        </label>
        <button class="btn" type="button" (click)="onSubmit()">Login</button>
        <a class="btn-link">Olvidaste tu contraseña?</a> <!-- Enlace de "¿Olvidaste tu contraseña?" -->
      </form>

      <p class="text-center mt-3"> <!-- Texto y botón para ir a registro -->
        ¿No tienes cuenta?
        <button class="btn btn-link" (click)="goToRegister()">Registrarse</button> <!-- Botón para ir a registro -->
      </p>
    </div>
  </div>
</div>
